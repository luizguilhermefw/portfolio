<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post do Blog - Luiz Guilherme Fernandes Wagner</title> <!-- O título será atualizado pelo JS -->
    <link rel="stylesheet" href="styleblog.css"> <!-- Reutilizando o CSS do blog -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
        /* Estilos adicionais específicos para a página de post individual, se necessário */
        .single-post-container {
            max-width: 800px; /* Limita a largura do conteúdo do post */
            margin: 30px auto;
            padding: 20px;
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .single-post-container img.post-image-full {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .single-post-container .post-content-full {
            line-height: 1.8; /* Melhorar a legibilidade do texto longo */
            white-space: pre-wrap; /* Preserva quebras de linha e espaços do conteúdo */
        }
        .post-meta-single {
            font-size: 0.9em;
            color: var(--text-secondary-color);
            margin-bottom: 25px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 15px;
        }
        .back-to-blog {
            display: inline-block;
            margin-top: 30px;
            margin-bottom: 10px;
            padding: 10px 15px;
            background-color: var(--accent-color);
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .back-to-blog:hover {
            background-color: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="background">
        <canvas id="constellation-canvas"></canvas>
    </div>
    <header class="blog-header">
        <h1 id="post-title-header">Carregando Post...</h1> <!-- Será atualizado pelo JS -->
        <a href="/blog" class="btn-voltar-portfolio" style="margin-top:10px;">Voltar para os Posts</a>
    </header>

    <main>
        <div id="single-post-content-area" class="single-post-container">
            <!-- O conteúdo do post será inserido aqui pelo JavaScript -->
            <p>Carregando conteúdo do post...</p>
        </div>
    </main>

    <button id="btnTopo" class="button-base" title="Subir para o topo">
        <i class="fas fa-rocket"></i>
    </button>
    
    <footer>
        <p><small>&copy; 2025 Blog de Luiz Guilherme Fernandes Wagner.</small></p>
    </footer>
    <script src="script_post_individual.js"></script>
</body>
</html>
